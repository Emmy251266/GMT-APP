/* ---------- App base ---------- */
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:#2b0508;color:#1c1c1c;font-family:'Poppins',system-ui,sans-serif;line-height:1.5;overflow-x:hidden;overscroll-behavior-y:none}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #ce9c1f;outline-offset:3px}

/* ---------- Member portal ---------- */
body{background:#0c0a09}
.pt-page{min-height:100svh;padding:calc(var(--header-h,100px) + clamp(16px,3vw,32px)) clamp(12px,3vw,32px) clamp(30px,5vw,60px);background:#0c0a09;color:#1c1c1c;font-family:'Poppins',sans-serif}
.pt-wrap{max-width:960px;margin:0 auto}
.pt-head{display:flex;align-items:center;gap:14px;padding:16px 18px;background:#fff;border-radius:14px;margin-bottom:12px}
.pt-logo{width:54px;height:auto;flex:none}.pt-who{flex:1;min-width:0}
.pt-who p{font-size:12px;color:#777}.pt-who h1{font:700 clamp(18px,3vw,26px)/1.2 'Poppins',sans-serif;color:#111;overflow-wrap:anywhere}
.pt-out{padding:10px 16px;border:2px solid #cfcfcf;border-radius:6px;font:600 13px 'Poppins',sans-serif;color:#333}
.pt-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.pt-tabs button{position:relative;flex:none;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font:600 13px 'Poppins',sans-serif;white-space:nowrap;transition:background .2s}
.pt-tabs button:hover{background:rgba(255,255,255,.22)}.pt-tabs button.on{background:#fff;color:#d42929}
.pt-tabs i{position:absolute;top:-4px;right:-2px;min-width:20px;padding:2px 5px;border-radius:99px;background:#ce9c1f;color:#111;font:700 11px/1.3 'Poppins',sans-serif;font-style:normal;text-align:center}.pt-tabs i[hidden]{display:none}
.pt-view{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.pt-card{padding:clamp(16px,3vw,28px);background:#fff;border-radius:14px;min-width:0}
.pt-card h2{font:700 clamp(19px,2.6vw,24px)/1.2 'Poppins',sans-serif;color:#111}.pt-card h3{font:600 16px/1.35 'Poppins',sans-serif;color:#111;margin:4px 0}
.pt-sub{margin:4px 0 14px;font-size:13px;color:#6b6b6b}.pt-meta{font-size:12.5px;color:#777;margin:2px 0 6px}.pt-body{font-size:14.5px;line-height:1.65;color:#333;white-space:pre-wrap;margin:6px 0 10px}.pt-clip{font-size:14px;color:#444;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0}
.pt-empty{padding:20px 6px;text-align:center;font-size:14px;color:#777}
.pt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.pt-grid .pt-card{border-top:4px solid #ce9c1f}
.pt-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:2px 0 4px}.pt-stats div{padding:12px 14px;background:#faf6ee;border-left:4px solid #ce9c1f;border-radius:4px}
.pt-stats small{display:block;font-size:12px;color:#7a6a45}.pt-stats b{display:block;font:700 clamp(17px,2.4vw,23px)/1.3 'Poppins',sans-serif;color:#111;overflow-wrap:anywhere}
.pt-banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:12px;background:#fff6dc;border-left:5px solid #d42929;color:#3b2c00;font-size:14px}.pt-banner p{margin:4px 0 0;font-size:13px;color:#5a4a1a}.pt-banner.ok{background:#e9f6ee;border-left-color:#1b7a3a;color:#14502a}
.pt-btn,.pt-btn2{display:inline-block;padding:11px 20px;border-radius:6px;font:700 14px 'Poppins',sans-serif;text-align:center;cursor:pointer;transition:background .2s,transform .2s}
.pt-btn{background:#d42929;color:#fff;border:2px solid #d42929}.pt-btn:hover{background:#a81e1e;border-color:#a81e1e}
.pt-btn2{background:#fff;color:#333;border:2px solid #cfcfcf}.pt-btn2:hover{border-color:#d42929;color:#d42929}
.pt-btn:disabled,.pt-btn2:disabled{opacity:.6;cursor:progress}
.pt-link{font:600 13px 'Poppins',sans-serif;color:#d42929;text-decoration:underline;padding:2px 0}.pt-link.red{color:#b3261e}
.pt-item{padding:16px 0;border-bottom:1px solid #eee}.pt-item:last-child{border-bottom:0}
.pt-chip{display:inline-block;margin-right:8px;padding:2px 10px;border-radius:99px;background:#f3e7c9;color:#6b5210;font:600 11px 'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.04em;vertical-align:2px}
.pt-chip.st-praying{background:#e4ecfb;color:#1d4ea5}.pt-chip.st-answered{background:#e1f4e7;color:#1b7a3a}
.pt-reply{padding:10px 12px;margin:6px 0;background:#f5f7fb;border-left:3px solid #1d4ea5;font-size:14px;color:#222}
.pt-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}.pt-act{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}.pt-ok{font-size:14px;font-weight:600;color:#1b7a3a}
.pt-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}.pt-yr{display:flex;align-items:center;gap:8px;margin:6px 0 12px;font-size:13px;color:#555}
.pt-seg{display:flex;gap:6px;margin-bottom:4px}.pt-seg button{padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font:600 13px 'Poppins',sans-serif}.pt-seg button.on{background:#ce9c1f;color:#111}
.pt-form{display:grid;gap:12px;margin:10px 0 18px}.pt-form label,.pt-two label{display:grid;gap:5px;font:500 12.5px 'Poppins',sans-serif;color:#555}
.pt-two{grid-template-columns:1fr 1fr}.pt-full{grid-column:1/-1}
.pt-in{width:100%;padding:12px 13px;font:400 15px 'Poppins',sans-serif;color:#111;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:6px}.pt-in:focus{outline:2px solid #d42929;background:#fff}.pt-s{width:auto;min-width:120px}
.pt-chk{display:flex!important;align-items:center;gap:8px;font-size:14px!important;color:#222!important}.pt-chk input{width:18px;height:18px;accent-color:#d42929}
.pt-msg{font:500 13px/1.5 'Poppins',sans-serif;color:#555;min-height:1px}.pt-msg.err{color:#b3261e}.pt-msg.ok{color:#1b7a3a}
.pt-table{width:100%;border-collapse:collapse}.pt-table th{text-align:left;padding:10px 8px;font:600 12px 'Poppins',sans-serif;color:#777;border-bottom:2px solid #eee}
.pt-table td{padding:12px 8px;font-size:14px;color:#222;border-bottom:1px solid #f0f0f0}.pt-table td.amt{font-weight:700;color:#d42929;white-space:nowrap}
.pt-sec{border:1px solid #eee;border-radius:10px;margin-bottom:10px;background:#fff}.pt-sec summary{padding:14px 16px;font:600 15px 'Poppins',sans-serif;color:#111;cursor:pointer}.pt-secb{padding:4px 16px 16px;display:grid;gap:12px}
.pt-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13.5px;color:#333}.pt-sum{font-weight:600;color:#111;font-size:14px}
.pt-stats.four{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
@media(max-width:640px){.pt-two{grid-template-columns:1fr}.pt-head{flex-wrap:wrap}
 .pt-table thead{display:none}.pt-table tr{display:block;padding:10px 0;border-bottom:1px solid #eee}.pt-table td{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border:0}.pt-table td::before{content:attr(data-l);font-size:12px;color:#888}}

/* ---------- App shell (appended) ---------- */
html{-webkit-tap-highlight-color:transparent}
body{overscroll-behavior-y:none}
button,a{touch-action:manipulation}
.pt-page{background:linear-gradient(#0c0a09,#2b0508) fixed}
.pt-wrap{max-width:1120px}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* greeting */
.pt-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:18px 20px;margin-bottom:16px;border-radius:22px;background:linear-gradient(120deg,#d42929,#5e0d14);color:#fff;box-shadow:0 14px 36px rgba(0,0,0,.35)}
.pt-hero::after{content:"";position:absolute;right:-50px;bottom:-80px;width:190px;height:190px;border-radius:50%;background:#ce9c1f;opacity:.35;pointer-events:none}
.pt-hero>*{position:relative;z-index:1}
.pt-hero .pt-logo{width:56px;height:56px;object-fit:contain;font-size:0}
.pt-hero .pt-who p{font-size:13px;color:#f6d98a}
.pt-hero .pt-who h1{color:#fff;font:700 clamp(20px,3.2vw,28px)/1.2 'Poppins',sans-serif}
.pt-ibtn{position:relative;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff}
.pt-ibtn:active{background:rgba(255,255,255,.26)}
.pt-hero .pt-out{min-height:46px;padding:0 18px;border:1px solid rgba(255,255,255,.4);border-radius:12px;background:rgba(255,255,255,.1);color:#fff}
.nbadge{margin-left:auto;min-width:20px;padding:2px 6px;border-radius:99px;background:#ce9c1f;color:#111;font:700 11px/1.3 'Poppins',sans-serif;font-style:normal;text-align:center}
.nbadge[hidden]{display:none}
.pt-ibtn .nbadge{position:absolute;top:-3px;right:-3px;margin:0}

/* layout: sidebar on wide screens, bottom bar on phones */
.pt-shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.pt-side{position:sticky;top:calc(var(--header-h,100px) + 16px);display:grid;gap:2px;padding:10px;background:#fff;border-radius:20px}
.pt-side button,.pt-list button,.pt-list a{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 14px;border-radius:12px;font:600 14px 'Poppins',sans-serif;color:#555;text-align:left;transition:background .15s,color .15s}
.pt-side button:hover,.pt-list button:hover,.pt-list a:hover{background:#f6efe6}
.pt-side button.on,.pt-list button.on{background:#d42929;color:#fff}
.pt-list button.out{color:#b3261e}
.pt-bar{display:none}
.pt-sheet{position:fixed;inset:0;z-index:60}
.pt-sheet[hidden]{display:none}
.pt-scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .2s}
.pt-panel{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(14px + env(safe-area-inset-bottom));background:#fff;border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .22s ease-out}
.pt-sheet.open .pt-scrim{opacity:1}
.pt-sheet.open .pt-panel{transform:none}
.pt-grab{width:40px;height:4px;margin:2px auto 10px;border-radius:2px;background:#ddd}
@media(min-width:861px){.pt-sheet{display:none!important}}
@media(max-width:860px){
  .pt-shell{grid-template-columns:minmax(0,1fr)}
  .pt-side{display:none}
  .pt-page{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  .pt-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;position:fixed;z-index:50;left:0;right:0;bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.35)}
  .pt-bar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border-radius:14px;font:600 11px 'Poppins',sans-serif;color:#6b6b6b;transition:background .15s,color .15s}
  .pt-bar button.on{background:#d42929;color:#fff}
  .pt-bar .nbadge{position:absolute;top:3px;left:calc(50% + 4px);margin:0}
  .site-footer,.to-top{display:none!important}
}
@media(max-width:640px){
  .pt-hero{padding:14px;gap:10px;border-radius:20px}
  .pt-hero .pt-logo{width:42px;height:42px}
  .pt-hero .pt-out{display:none}
  .pt-hero .pt-who h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

/* cards, buttons, inputs */
.pt-card{border-radius:20px}
.pt-btn,.pt-btn2{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px}
.pt-btn:active,.pt-btn2:active{transform:scale(.98)}
.pt-in{min-height:46px;font-size:16px;border-radius:12px}
textarea.pt-in{min-height:0}
.pt-link{text-align:left}
.pt-chip{text-transform:none;letter-spacing:0;font-size:12px}
.pt-stats div{border-radius:12px}
.pt-grid .pt-card{border-top:0}
.pt-view>*{animation:ptIn .2s ease-out}
@keyframes ptIn{from{opacity:0}to{opacity:1}}

/* quick actions */
.pt-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pt-tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:112px;padding:14px;border-radius:16px;background:#fff;color:#111;text-align:left;transition:transform .12s}
.pt-tile:active{transform:scale(.98)}
.pt-tile b{margin-top:10px;font:700 15px 'Poppins',sans-serif}
.pt-tile small{font-size:12px;line-height:1.35;color:#777}
.pt-tic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#fbe9ea;color:#d42929}
.pt-tile.gold{background:linear-gradient(135deg,#ecc766,#c6961f)}
.pt-tile.gold .pt-tic{background:rgba(255,255,255,.4);color:#5b3b00}
.pt-tile.gold small{color:#5b3b00}
@media(max-width:640px){.pt-tiles{grid-template-columns:1fr 1fr}}

/* tithe reminder */
.pt-banner{flex-wrap:nowrap;gap:14px;padding:16px;border-radius:18px;border-left:0;background:#fff3cf}
.pt-bic{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:50%;background:#d42929;color:#fff}
.pt-banner.ok .pt-bic{background:#1b7a3a}
.pt-bt,.pt-banner>div{flex:1;min-width:0}
@media(max-width:640px){.pt-banner{flex-wrap:wrap}.pt-bt,.pt-banner>div{flex:1 1 calc(100% - 60px)}.pt-banner .pt-btn{width:100%}}

/* events */
.pt-ev{display:grid;grid-template-columns:60px minmax(0,1fr);gap:14px}
.pt-evrow{display:flex;gap:14px;align-items:flex-start}
.pt-date{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;width:60px;height:64px;border-radius:14px;background:linear-gradient(#d42929,#a81e1e);color:#fff}
.pt-date b{font:700 22px/1 'Poppins',sans-serif}
.pt-date span{margin-top:4px;font:600 12px/1 'Poppins',sans-serif;color:#f6d98a}
@media(max-width:480px){.pt-act .pt-btn,.pt-act .pt-btn2,.pt-act select{width:100%}}

/* loading */
.pt-skel{display:grid;gap:14px}
.pt-skel i{display:block;height:92px;border-radius:20px;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.16),rgba(255,255,255,.07));background-size:200% 100%;animation:ptSk 1.2s linear infinite}
@keyframes ptSk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.pt-skel i,.pt-view>*{animation:none}.pt-panel,.pt-scrim{transition:none}}

/* ---------- App layout: one phone-width column, bottom tab bar always ---------- */
.pt-page{min-height:100svh;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(96px + env(safe-area-inset-bottom))}
.pt-wrap{max-width:560px}
.pt-shell{grid-template-columns:minmax(0,1fr)}
.pt-side{display:none}
.pt-grid{grid-template-columns:minmax(0,1fr)}
.pt-tiles{grid-template-columns:1fr 1fr}
.pt-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;position:fixed;z-index:50;bottom:0;left:50%;width:min(100%,560px);transform:translateX(-50%);padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.35)}
.pt-bar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border-radius:14px;font:600 11px 'Poppins',sans-serif;color:#6b6b6b}
.pt-bar button.on{background:#a31820;color:#fff}
.pt-bar .nbadge{position:absolute;top:3px;left:calc(50% + 4px);margin:0}
.pt-sheet{display:block!important}
.pt-sheet[hidden]{display:none!important}
.pt-panel{left:50%;right:auto;width:min(100%,560px);transform:translate(-50%,100%)}
.pt-sheet.open .pt-panel{transform:translate(-50%,0)}
.pt-hero .pt-out{display:none}
.pt-hero .pt-who h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-list a.on{background:#a31820;color:#fff}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 38%,#8a141b 0%,#4a0a0f 55%,#2b0508 100%);color:#fff;transition:opacity .45s ease}
#splash.gone{opacity:0;pointer-events:none}
.sp-logo{width:132px;height:132px;object-fit:contain;font-size:0;animation:spIn .7s ease-out both}
.sp-in{display:grid;justify-items:center;gap:14px}
.sp-in h1{font:600 clamp(20px,6vw,26px)/1.25 'Cinzel',Georgia,serif;letter-spacing:.06em;color:#fff;animation:spIn .7s .2s ease-out both}
.sp-in p{font:500 13px/1 'Poppins',sans-serif;letter-spacing:.18em;color:#ecc766;animation:spIn .7s .35s ease-out both}
.sp-bar{width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.sp-bar i{display:block;height:100%;width:100%;background:#ce9c1f;transform-origin:left;animation:spBar 1.7s ease-in-out both}
@keyframes spIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){#splash{transition:none}.sp-logo,.sp-in h1,.sp-in p,.sp-bar i{animation:none}}

/* ---------- Register / login ---------- */
.au{min-height:100svh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:calc(env(safe-area-inset-top) + 28px) 16px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(#4a0a0f,#2b0508) fixed}
.au-top{display:grid;justify-items:center;gap:6px;text-align:center;color:#fff;max-width:520px}
.au-logo{width:84px;height:84px;object-fit:contain;font-size:0;margin-bottom:6px}
.au-top h1{font:700 clamp(24px,7vw,30px)/1.2 'Poppins',sans-serif}
.au-top p{font-size:14px;color:#f6d98a}
.au-card{width:100%;max-width:520px;padding:18px;background:#fff;border-radius:22px;box-shadow:0 14px 36px rgba(0,0,0,.35)}
.au-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:14px;border-radius:14px;background:#f3ece0}
.au-tabs button{min-height:44px;border-radius:11px;font:600 14px 'Poppins',sans-serif;color:#6b5b4b}
.au-tabs button.on{background:#a31820;color:#fff}
.au .pt-form{margin:0}
.au .pt-btn{width:100%}
.au-pw{position:relative;display:block}
.au-pw .pt-in{width:100%;padding-right:68px}
.au-pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-width:56px;min-height:36px;border-radius:10px;font:600 12.5px 'Poppins',sans-serif;color:#a31820}
#forgot{justify-self:start;min-height:36px;font-size:13px}
.au-foot{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:13px;color:#e8c9a0}
.au-foot a{text-decoration:underline;text-underline-offset:3px}

/* ---------- Website theme (black, red header, gold, cream) ---------- */
body{background:#0c0a09;color:#f4ecd8}
.pt-page{background:#0c0a09;padding:calc(78px + env(safe-area-inset-bottom) * 0 + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
.app-bar{position:fixed;z-index:40;top:0;left:0;right:0;padding-top:env(safe-area-inset-top);background:#d42929;box-shadow:0 2px 14px rgba(0,0,0,.45)}
.app-bar--static{position:relative;box-shadow:none}
.app-bar-in{max-width:560px;height:64px;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:10px}
.ab-logo{width:46px;height:44px;flex:none;object-fit:contain;font-size:0}
.ab-name{flex:1;min-width:0;font:700 13px/1.2 'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.02em;color:#fff}
.app-bar .pt-ibtn{background:rgba(0,0,0,.2);width:44px;height:44px}
.gr{padding:4px 4px 16px;margin-bottom:16px;border-bottom:1px solid rgba(198,150,31,.35)}
.gr #hello{font-size:13px;color:#ecc766}
.gr #who{font:700 clamp(24px,7vw,30px)/1.2 'Poppins',sans-serif;color:#fff;overflow-wrap:anywhere}
.gr #today{font-size:13px;color:#cdc2a6}

/* content cards: cream on black */
.pt-card,.pt-tile:not(.gold),.pt-stats div{background:#f7f0df}
.pt-card{border:1px solid rgba(198,150,31,.45)}
.pt-card h2,.pt-grid .pt-card h3:first-child{font-family:'Cinzel',Georgia,serif;font-weight:700;letter-spacing:.03em}
.pt-btn{background:#d42929;color:#fff;border-radius:999px;padding-inline:24px;font-weight:700}
.pt-btn:hover{filter:brightness(1.1)}
.pt-btn2{border-radius:999px}
.pt-date{background:linear-gradient(#d42929,#a81e1e)}
.pt-link{color:#b01e1e}

/* tab bar + More sheet: dark with gold line */
.pt-bar{background:#14100e;border-top:1px solid rgba(198,150,31,.4);box-shadow:0 -8px 28px rgba(0,0,0,.6)}
.pt-bar button{color:#cdc2a6}
.pt-bar button.on{background:#d42929;color:#fff}
.pt-panel{background:#17110f;border-top:1px solid rgba(198,150,31,.4)}
.pt-grab{background:#4a3d36}
.pt-list button,.pt-list a{color:#f4ecd8}
.pt-list button:hover,.pt-list a:hover{background:rgba(255,255,255,.07)}
.pt-list button.on{background:#d42929;color:#fff}
.pt-list button.out{color:#ff8a80}
.pt-skel i{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%}

/* embers (same effect as the website hero) */
.embers{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.ember{position:absolute;bottom:-14px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,#ffeab0 0%,#d9a52a 55%,transparent 72%);opacity:0;animation:rise var(--t) linear var(--dl) infinite}
@keyframes rise{0%{transform:translate3d(0,0,0) scale(.6);opacity:0}12%{opacity:.9}80%{opacity:.45}100%{transform:translate3d(var(--dx),-105vh,0) scale(1.1);opacity:0}}
@keyframes logoGlow{0%,100%{filter:drop-shadow(0 0 10px rgba(198,150,31,.25))}50%{filter:drop-shadow(0 0 30px rgba(230,180,60,.65))}}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes shimmer{0%{background-position:150% 0}100%{background-position:-100% 0}}

/* splash */
#splash{overflow:hidden;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.84)),url(https://gmtinternationalchurch.vercel.app/images/099a78c35266b32c430cc7a6914d1dcd40e5b31b.jpeg) center/cover #000}
.sp-in,.sp-bar{position:relative;z-index:2}
.sp-logo{animation:spIn .7s ease-out both,logoGlow 4.5s ease-in-out .7s infinite,floaty 7s ease-in-out .7s infinite}
.sp-in h1{font:700 clamp(22px,6.5vw,30px)/1.2 'Poppins',sans-serif;letter-spacing:-.01em;color:#fff}
.sp-in p{font-size:15px;font-weight:600;letter-spacing:.16em;background:linear-gradient(100deg,#fff 0%,#fff 38%,#f3cf7a 50%,#fff 62%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:spIn .7s .35s ease-out both,shimmer 4s linear 1.2s infinite}

/* register / login */
.au{display:block;position:relative;overflow:hidden;padding:0 0 calc(24px + env(safe-area-inset-bottom));background:#0c0a09}
.au::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(rgba(12,10,9,.7),rgba(12,10,9,.93)),url(https://gmtinternationalchurch.vercel.app/images/099a78c35266b32c430cc7a6914d1dcd40e5b31b.jpeg) center/cover}
.au>.app-bar,.au>.au-main{position:relative;z-index:2}
.au>.app-bar{position:relative}
.au-main{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:520px;margin:0 auto;padding:26px 16px 0}
.au-card{background:rgba(22,16,13,.92);border:1px solid rgba(198,150,31,.4);color:#f4ecd8}
.au-tabs{background:#1d1512}
.au-tabs button{color:#cdc2a6}
.au-tabs button.on{background:#d42929;color:#fff}
.au .pt-form label{color:#cdc2a6}
.au .pt-in{background:#1d1512;border:1px solid #3a2a22;color:#f4ecd8}
.au .pt-in:focus{border-color:#ce9c1f;outline:0;box-shadow:0 0 0 3px rgba(206,156,31,.25)}
.au .pt-link,.au-pw button{color:#ecc766}

.au .pt-msg.ok{color:#8fe3a1}
.au-top h1{color:#fff}
.au-foot a{color:#ecc766}
@media(prefers-reduced-motion:reduce){.embers{display:none}.sp-logo{animation:none}.sp-in p{animation:none;-webkit-text-fill-color:#f3cf7a;color:#f3cf7a;background:none}}

function show(id){['auth','app'].forEach(function(k){$('#'+k).hidden=(k!==id)})}
function friendly(e){var t=(e&&e.message||'').toLowerCase();
 if(t.indexOf('invalid login')>-1)return 'Email or password is not correct.';
 if(t.indexOf('already')>-1)return 'This email already has an account. Try logging in.';
 if(t.indexOf('confirm')>-1)return 'Please confirm your email first. Check your inbox.';
 if(t.indexOf('rate')>-1||t.indexOf('seconds')>-1)return 'Too many tries. Wait a minute and try again.';
 if(t.indexOf('password')>-1)return 'That password is too weak. Try a longer one.';
 return (e&&e.message)||'Something went wrong. Please try again.'}
function setMode(m){mode=m;var reg=m==='register',rst=m==='reset';
 $('#tabLogin').classList.toggle('on',m==='login');$('#tabReg').classList.toggle('on',reg);
 $('#tabLogin').setAttribute('aria-selected',m==='login');$('#tabReg').setAttribute('aria-selected',reg);
 $('#fName').hidden=!reg;$('#fPhone').hidden=!reg;$('#fEmail').hidden=rst;$('#forgot').hidden=m!=='login';$('#tabs').hidden=rst;
 $('#authGo').textContent=rst?'Save new password':reg?'Create account':'Log in';
 $('#authTitle').textContent=rst?'Set a new password':reg?'Join the family':'Welcome back';
 $('#authSub').textContent=rst?'Choose a new password for your account.':reg?'Create your member account in a minute.':'Log in to your member account.';
 $('#pass').autocomplete=m==='login'?'current-password':'new-password';
 note($('#authMsg'),'')}
$('#tabLogin').addEventListener('click',function(){setMode('login')});
$('#tabReg').addEventListener('click',function(){setMode('register')});
$('#eye').addEventListener('click',function(){var p=$('#pass'),on=p.type==='password';p.type=on?'text':'password';this.textContent=on?'Hide':'Show';this.setAttribute('aria-label',on?'Hide password':'Show password')});
function offline(btn,m){if(btn)idle(btn);note(m,'Could not connect. Check your internet and try again.','err')}
$('#authForm').addEventListener('submit',function(e){e.preventDefault();
 var m=$('#authMsg'),btn=$('#authGo'),em=$('#email').value.trim(),pw=$('#pass').value;
 if(mode==='reset'){if(pw.length<8)return note(m,'Use at least 8 characters.','err');busy(btn,'Saving...');
  return sb.auth.updateUser({password:pw}).then(function(r){idle(btn);if(r.error)return note(m,friendly(r.error),'err');recovering=false;history.replaceState(null,'',location.pathname);
   return sb.auth.getSession().then(function(x){if(x.data.session)boot(x.data.session);else setMode('login')})}).catch(function(){offline(btn,m)})}
 if(!/^\S+@\S+\.\S+$/.test(em))return note(m,'Enter a valid email address.','err');
 if(!pw)return note(m,'Enter your password.','err');
 if(mode==='login'){busy(btn,'Logging in...');
  return sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){idle(btn);if(r.error)return note(m,friendly(r.error),'err');boot(r.data.session)}).catch(function(){offline(btn,m)})}
 var nm=$('#name').value.trim(),ph=$('#phone').value.trim();
 if(!nm)return note(m,'Please enter your full name.','err');
 if(pw.length<8)return note(m,'Use at least 8 characters for your password.','err');
 busy(btn,'Creating account...');
 sb.auth.signUp({email:em,password:pw,options:{data:{full_name:nm,phone:ph}}}).then(function(r){idle(btn);
  if(r.error)return note(m,friendly(r.error),'err');
  if(r.data&&r.data.session){sb.from('profiles').update({full_name:nm,phone:ph}).eq('id',r.data.user.id).then(function(){},function(){});return boot(r.data.session)}
  setMode('login');note($('#authMsg'),'Account created. Check your email to confirm it, then log in.','ok')}).catch(function(){offline(btn,m)})});
$('#forgot').addEventListener('click',function(){var m=$('#authMsg'),em=$('#email').value.trim();
 if(!/^\S+@\S+\.\S+$/.test(em))return note(m,'Type your email above first, then tap Forgot password.','err');
 sb.auth.resetPasswordForEmail(em,{redirectTo:APP_URL||(location.origin+location.pathname)}).then(function(r){if(r.error)note(m,friendly(r.error),'err');else note(m,'Check your email for a reset link.','ok')}).catch(function(){offline(null,m)})});

function boot(s){user=s.user;show('app');put($('#view'),skel());
 return q(sb.from('profiles').select('*').eq('id',user.id).single().then(function(x){return {data:x.data?[x.data]:[],error:x.error}})).then(function(p){
  me=p[0]||{};isAdmin=me.role==='admin';
  $('#who').textContent=me.full_name||(user.user_metadata&&user.user_metadata.full_name)||user.email;
  var pr=isAdmin?q(sb.from('profiles').select('id,full_name,email,phone')).then(function(l){l.forEach(function(x){names[x.id]={name:x.full_name,email:x.email,phone:x.phone}})}):Promise.resolve();
  return pr.then(function(){greet();drawTabs();go(startView(),true);badge()})}).catch(function(e){put($('#view'),card('',[empty(oops(e))]))})}

sb.auth.onAuthStateChange(function(ev){
 if(ev==='PASSWORD_RECOVERY')recovering=true;
 if(ev==='SIGNED_OUT'){user=null;me=null;isAdmin=false;cur='home';history.replaceState(null,'',location.pathname);$('#authForm').reset();setMode('login');show('auth')}});

var t0=Date.now(),calm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!calm)[].forEach.call(document.querySelectorAll('.embers'),function(box){for(var i=0;i<22;i++){var e=document.createElement('span');e.className='ember';e.style.setProperty('--x',(Math.random()*100).toFixed(1)+'%');e.style.setProperty('--s',(3+Math.random()*6).toFixed(1)+'px');e.style.setProperty('--t',(9+Math.random()*9).toFixed(1)+'s');e.style.setProperty('--dl',(-Math.random()*16).toFixed(1)+'s');e.style.setProperty('--dx',((Math.random()-.5)*160).toFixed(0)+'px');box.appendChild(e)}});
function endSplash(){var sp=$('#splash');sp.classList.add('gone');setTimeout(function(){sp.hidden=true},calm?0:450)}
sb.auth.getSession().then(function(r){return r.data.session},function(){return null}).then(function(s){
 setTimeout(function(){endSplash();
  if(recovering){setMode('reset');show('auth')}
  else if(s)boot(s);
  else{setMode('login');show('auth')}},Math.max(0,(calm?200:1800)-(Date.now()-t0)))});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
